aspectjx {
    // 开启 AspectJX 功能
    enabled true

    // 只对项目自身代码（com.xxl 包）做 AOP 织入，第三方库一律跳过
    // 白名单方式比黑名单（exclude）更安全：不会因遗漏而误织入第三方库，避免拖慢构建或产生冲突
    // 覆盖：com.xxl.core（切面 + AOP 注解）、com.xxl.kit、com.xxl.hello.*（annotation/common/compiler/router/service/widget/main/user）
    // 如果要测试织入别的包名的代码，可以暂时改回之前的方式
    include 'com.xxl'
}
